name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Lint, Typecheck & Deno Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Lint Edge Functions (Deno)
        run: npm run functions:lint

      - name: Typecheck Edge Functions (Deno)
        run: npm run functions:check

  database-and-e2e:
    name: Database (pgTAP) & Playwright E2E
    runs-on: ubuntu-latest
    needs: checks
    env:
      E2E_PLATFORM_ADMIN_EMAIL: e2e-admin@example.test
      E2E_PLATFORM_ADMIN_PASSWORD: E2e-Admin-Password-2026!
      E2E_MAILPIT_URL: http://127.0.0.1:54324
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local Supabase stack
        run: supabase start

      - name: Run pgTAP database & RLS tests
        run: supabase test db

      - name: Configure .env.local and seed E2E platform_admin
        run: |
          eval "$(supabase status -o env)"
          cat <<EOF > .env.local
          NEXT_PUBLIC_SUPABASE_URL=${API_URL}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${ANON_KEY}
          E2E_PLATFORM_ADMIN_EMAIL=${E2E_PLATFORM_ADMIN_EMAIL}
          E2E_PLATFORM_ADMIN_PASSWORD=${E2E_PLATFORM_ADMIN_PASSWORD}
          E2E_MAILPIT_URL=${E2E_MAILPIT_URL}
          EOF

          USER_JSON=$(curl -sS -X POST "${API_URL}/auth/v1/admin/users" \
            -H "apikey: ${SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${E2E_PLATFORM_ADMIN_EMAIL}\",\"password\":\"${E2E_PLATFORM_ADMIN_PASSWORD}\",\"email_confirm\":true}")

          USER_ID=$(echo "${USER_JSON}" | node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync(0,'utf8')); if(!d.id){console.error(d);process.exit(1);} console.log(d.id);")

          psql "${DB_URL}" -c "INSERT INTO public.platform_admins (user_id) VALUES ('${USER_ID}') ON CONFLICT (user_id) DO NOTHING;"

      - name: Serve Edge Functions & run Playwright E2E tests
        run: |
          supabase functions serve &
          FUNC_PID=$!
          sleep 3
          npm run test:e2e
          kill $FUNC_PID || true

      - name: Upload Playwright report & videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  docker:
    name: Docker Build & Healthcheck
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production Docker image
        run: docker build -t class-y:ci .

      - name: Verify container startup & /api/health response
        run: |
          docker run -d --name class-y-ci -p 3000:3000 \
            -e NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321 \
            -e NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=ci-test-key \
            class-y:ci
          for i in $(seq 1 15); do
            STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" http://127.0.0.1:3000/api/health || true)
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "503" ]; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          docker logs class-y-ci
          exit 1
