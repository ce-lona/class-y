<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>class-y Neustart Prototyp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Newsreader:opsz,wght@6..72,500&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE  work: ein ausgeliefertes Produkt, ruhig, dicht, präzise
   IDEA   Studio-Schaltzentrale: Sidebar wie ein Kursbuch-Register, Inhalt wie ein sauber linierter Stundenplan
   PICTURE die App selbst, jede Rolle mit echten Beispieldaten
   COLOUR class-y Petrol #1F5F5C führt, Warmgrau trägt, Indigo nur für Links, Status grün/amber/rot; Nacht = warmes Anthrazit statt Schwarz
   TYPE   Manrope für Überschriften, Source Sans 3 für Text, Newsreader nur für die Wortmarke
   LAYOUT Desktop: Sidebar 248px + volle Breite, Details im Seitenpanel. Trainer mobil: Telefon mit Bottom-Bar */
:root{
  --bg:#F5F4F1;--panel:#FFFFFF;--side:#FBFAF8;--ink:#201F1C;--ink2:#45423D;--mute:#7C7870;--line:#E5E3DF;--line2:#EFEDEA;--hover:#F2F1EF;
  --pri:#1F5F5C;--prifg:#FFFFFF;--pritx:#1F5F5C;--prisoft:#E3EFEE;--link:#5450C4;--linksoft:#ECEBFB;
  --ok:#1D8A5F;--oksoft:#E7F6EE;--warn:#9A6203;--warnsoft:#FCF1DC;--err:#C81E1E;--errsoft:#FDECEC;
  --shadow:0 12px 32px rgba(32,31,28,.14),0 2px 6px rgba(32,31,28,.06);
  --chrome:#201F1C;--chromeink:#F2F1EF;--chromemute:#A9A59C;
}
:root[data-theme=dark]{
  --bg:#2B2926;--panel:#35332F;--side:#302E2A;--ink:#F2F1EF;--ink2:#D8D5CE;--mute:#ADA99F;--line:#4A4741;--line2:#413E39;--hover:#3E3B37;
  --pri:#79B0AD;--prifg:#0F2E2D;--pritx:#A7CDCB;--prisoft:rgba(121,176,173,.17);--link:#A3A2F0;--linksoft:rgba(139,138,232,.18);
  --ok:#63C99B;--oksoft:rgba(29,138,95,.2);--warn:#F0B44C;--warnsoft:rgba(184,117,3,.22);--err:#F38A8A;--errsoft:rgba(220,38,38,.2);
  --shadow:0 12px 32px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.25);
  --chrome:#151412;
  color-scheme:dark;
}
:root{color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Source Sans 3",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Manrope,system-ui,sans-serif;letter-spacing:-.015em;margin:0;line-height:1.15}
h1{font-size:24px;font-weight:800}
h2{font-size:16px;font-weight:700}
h3{font-size:14px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link)}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:15px;height:15px}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
#root{height:100%;display:flex;flex-direction:column}

/* Prototyp-Leiste (nicht Teil der App) */
.proto{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:7px 16px;background:var(--chrome);color:var(--chromeink);font-size:13px}
.proto b{font-family:Manrope;font-weight:800;letter-spacing:-.01em}
.proto .grp{display:flex;align-items:center;gap:6px}
.proto .lbl{color:var(--chromemute)}
.seg{display:inline-flex;background:rgba(255,255,255,.08);border-radius:8px;padding:2px}
.seg button{border:0;background:none;color:var(--chromemute);padding:4px 10px;border-radius:6px;font-weight:600;font-size:13px;white-space:nowrap}
.seg button.on{background:#F2F1EF;color:#201F1C}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.proto .concept{margin-left:auto;border:1px solid rgba(255,255,255,.25);background:none;color:var(--chromeink);border-radius:8px;padding:4px 12px;font-weight:600}
.stage{flex:1;min-height:0;position:relative}

/* App-Rahmen */
.app{height:100%;display:grid;position:relative;overflow:hidden}
.side-layout{grid-template-columns:248px minmax(0,1fr)}
.bars-layout{grid-template-rows:auto auto minmax(0,1fr)}
.main{overflow:auto;min-height:0;position:relative}
.wrap{padding:22px 32px 48px;max-width:1480px}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:auto;padding:14px 12px}
.logo{display:flex;align-items:center;gap:9px;padding:4px 8px 14px;font-family:Newsreader,Georgia,serif;font-size:22px;font-weight:500;letter-spacing:-.01em;color:var(--ink)}
.logo svg{width:26px;height:26px}
.sec{font-size:12px;font-weight:700;color:var(--mute);padding:14px 10px 6px}
.nv{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;color:var(--ink2);font-weight:600;text-align:left;font-size:14.5px}
.nv:hover{background:var(--hover);color:var(--ink)}
.nv.on{background:var(--prisoft);color:var(--pritx)}
.nv .cnt{margin-left:auto;font-size:12px;font-weight:700;background:var(--errsoft);color:var(--err);border-radius:99px;padding:0 7px;line-height:19px}
.nv.on .cnt{background:var(--panel)}
.spacer{flex:1;min-height:12px}
.switch{position:relative;margin:2px 0 4px}
.swbtn{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px;text-align:left}
.swbtn:hover{border-color:var(--mute)}
.swbtn .nm{font-weight:700;font-size:14.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swbtn .mt{font-size:12.5px;color:var(--mute);line-height:1.2}
.swbtn.static{cursor:default}
.sq{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:800 12px Manrope;color:#fff;flex:none}
.scope{display:flex;align-items:center;gap:8px;margin:6px 0 2px;padding:0 4px}
.scope select{flex:1}
select.sel,input.inp,textarea.inp{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;font-size:14.5px;min-height:36px}
select.sel{padding-right:28px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
input.inp:focus,select.sel:focus,textarea.inp:focus{border-color:var(--pri);outline:none;box-shadow:0 0 0 3px var(--prisoft)}
.user{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px;border-radius:10px;text-align:left;margin-top:4px;border-top:1px solid var(--line)}
.user:hover{background:var(--hover)}
.av{width:30px;height:30px;border-radius:99px;display:grid;place-items:center;font:800 12px Manrope;flex:none;background:var(--pri);color:var(--prifg)}
.av.t{background:var(--hover);color:var(--ink);border:1px solid var(--line)}
.av.s{background:var(--link);color:#fff}
.user .nm{font-weight:700;font-size:14px;line-height:1.2}
.user .mt{font-size:12.5px;color:var(--mute);line-height:1.2}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:2px 0 8px;padding:10px;border:0;border-radius:10px;background:var(--pri);color:var(--prifg);font-weight:700}

/* Zwei-Leisten-Variante */
.bar1{display:flex;align-items:center;gap:6px;padding:0 16px;height:50px;background:var(--side);border-bottom:1px solid var(--line)}
.bar1 .logo{padding:0 14px 0 0}
.ctab{display:flex;align-items:center;gap:8px;border:0;background:none;padding:6px 10px;border-radius:8px;font-weight:700;font-size:14px;color:var(--ink2);white-space:nowrap}
.ctab .sq{width:22px;height:22px;font-size:10px;border-radius:6px}
.ctab.on{background:var(--prisoft);color:var(--pritx)}
.ctab:hover{background:var(--hover)}
.bar1 .rt{margin-left:auto;display:flex;gap:8px;align-items:center}
.vline{width:1px;height:22px;background:var(--line);margin:0 6px}
.bar2{display:flex;align-items:center;gap:2px;padding:0 16px;height:46px;border-bottom:1px solid var(--line);background:var(--panel);overflow:hidden}
.ptab{display:flex;align-items:center;gap:7px;border:0;background:none;height:46px;padding:0 12px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap;font-size:14.5px}
.ptab.on{color:var(--pritx);border-bottom-color:var(--pri)}
.ptab .cnt{font-size:12px;font-weight:700;background:var(--errsoft);color:var(--err);border-radius:99px;padding:0 7px;line-height:19px}
.bar2 .rt{margin-left:auto;display:flex;align-items:center;gap:8px}

/* Seitenkopf, Buttons, Chips */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;margin-bottom:16px}
.ph .tt{flex:1 1 260px}
.ph .sub{color:var(--mute);margin:4px 0 0;font-size:14.5px}
.ph .act{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px;white-space:nowrap;min-height:36px}
.btn:hover{border-color:var(--mute)}
.btn.p{background:var(--pri);border-color:var(--pri);color:var(--prifg)}
.btn.p:hover{filter:brightness(1.08)}
.btn.g{border-color:transparent;background:none}
.btn.g:hover{background:var(--hover)}
.btn.d{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,transparent)}
.btn.sm{min-height:30px;padding:4px 10px;font-size:13.5px}
.btn.ok{background:var(--oksoft);border-color:transparent;color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 12px;font-weight:600;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.chip .n{font-variant-numeric:tabular-nums;color:var(--mute);font-weight:700}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.on .n{color:var(--bg);opacity:.75}
.chip .dot{width:8px;height:8px;border-radius:99px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:10px;color:var(--mute)}
.search input{padding-left:34px;width:260px}
.tog{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--panel)}
.tog button{border:0;background:none;padding:5px 12px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--mute);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tog button.on{background:var(--prisoft);color:var(--pritx)}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:1px 8px;font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--hover);color:var(--ink2)}
.b-ok{background:var(--oksoft);color:var(--ok)}
.b-warn{background:var(--warnsoft);color:var(--warn)}
.b-err{background:var(--errsoft);color:var(--err)}
.b-link{background:var(--linksoft);color:var(--link)}
.b-pri{background:var(--prisoft);color:var(--pritx)}
.b-off{background:none;color:var(--mute);text-decoration:line-through;padding-left:0}

/* Flächen und Tabellen */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.panel>.hd{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line2)}
.panel>.bd{padding:14px 16px}
.tblw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:12.5px;font-weight:700;color:var(--mute);padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel);position:sticky;top:0}
td{padding:9px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.cl{cursor:pointer}
tbody tr.cl:hover td{background:var(--hover)}
tr.sel td{background:var(--prisoft)!important}
tr.pend td{background:color-mix(in srgb,var(--warnsoft) 55%,transparent)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.nw{white-space:nowrap}
.muted{color:var(--mute)}
.sm{font-size:13px}
.who{display:flex;align-items:center;gap:10px}
.who .av{width:28px;height:28px;font-size:11px}
.who .nm{font-weight:600;line-height:1.2}
.who .mt{font-size:12.5px;color:var(--mute);line-height:1.2}
tfoot td{font-weight:700;border-top:1px solid var(--line);border-bottom:0}
.tdot{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:7px;vertical-align:1px}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:18px;align-items:start}
.grid-rail{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px}
.statline{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--mute);font-size:14px;margin:-6px 0 16px}
.statline b{color:var(--ink);font-variant-numeric:tabular-nums}
.statline button{border:0;background:none;padding:0;color:inherit}
.statline button:hover b{color:var(--pritx);text-decoration:underline}

/* Übersicht */
.task{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line2);align-items:flex-start}
.task:last-child{border-bottom:0}
.task .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none}
.task .tx{flex:1}
.task .t1{font-weight:700}
.task .t2{color:var(--mute);font-size:13.5px}
.task .ac{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tl{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:2px 12px;padding:9px 16px;border-bottom:1px solid var(--line2);align-items:center}
.tl:last-child{border-bottom:0}
.tl .tm{font:700 15px Manrope;font-variant-numeric:tabular-nums}
.tl .c{font-weight:600;line-height:1.25}
.tl .m{font-size:13px;color:var(--mute);line-height:1.25}
.heat{display:grid;grid-template-columns:130px repeat(7,minmax(0,1fr));gap:4px;align-items:center;font-size:13px}
.heat .hd{color:var(--mute);font-weight:700;text-align:center;font-size:12px}
.heat .cell{height:26px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
.heat .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Kurspläne */
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:280px;display:flex;flex-direction:column}
.day.today{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri) inset}
.day .dh{padding:9px 12px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;align-items:baseline}
.day .dh b{font-family:Manrope}
.day .dh span{font-size:12.5px;color:var(--mute)}
.slot{margin:8px 8px 0;padding:8px 10px;border-radius:8px;background:var(--bg);border-left:3px solid var(--c);position:relative}
.slot .tm{font:700 14px Manrope;font-variant-numeric:tabular-nums}
.slot .ty{font-weight:600;font-size:14px;line-height:1.2}
.slot .tr{font-size:12.5px;color:var(--mute);line-height:1.3}
.slot .x{position:absolute;right:4px;top:4px;border:0;background:none;color:var(--mute);padding:2px;border-radius:4px}
.addslot{margin:8px;border:1px dashed var(--line);background:none;border-radius:8px;padding:6px;color:var(--mute);font-weight:600;font-size:13px}
.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--warnsoft);color:var(--ink);margin-bottom:12px;font-size:14px}
.banner .sp{flex:1 1 280px}
.banner.info{background:var(--prisoft)}

/* Drawer und Popover */
.scrim{position:absolute;inset:0;background:rgba(20,19,17,.28);z-index:40}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:41;display:flex;flex-direction:column;animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}}
.drawer .dhd{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer .dbd{flex:1;overflow:auto;padding:4px 20px 20px}
.drawer .dft{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.dsec{padding:14px 0;border-bottom:1px solid var(--line2)}
.dsec:last-child{border-bottom:0}
.dsec h3{margin-bottom:8px}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:6px 12px;font-size:14px}
.kv dt{color:var(--mute)}
.kv dd{margin:0;font-weight:600}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label,.flbl{font-weight:600;font-size:13.5px}
.field .hint{font-size:12.5px;color:var(--mute)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:var(--panel);width:100%;text-align:left}
.opt.on{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri) inset;background:var(--prisoft)}
.opt .t1{font-weight:700}
.opt .t2{font-size:13px;color:var(--mute)}
.pop{position:absolute;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;width:300px}
.pop .pi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:7px 8px;border-radius:8px;text-align:left}
.pop .pi:hover{background:var(--hover)}
.pop .pi.on{background:var(--prisoft)}
.pop .pi .nm{font-weight:600;line-height:1.2}
.pop .pi .mt{font-size:12.5px;color:var(--mute);line-height:1.2}
.pop .ps{padding:6px 8px 4px;font-size:12px;font-weight:700;color:var(--mute)}
.pop input{width:100%;margin-bottom:4px}
.pop .kbd{margin-left:auto;font-size:11.5px;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center;max-width:90%}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg2 button{border:0;background:var(--panel);padding:6px 12px;font-weight:600;font-size:13.5px;color:var(--ink2);border-right:1px solid var(--line);white-space:nowrap}
.seg2 button:last-child{border-right:0}
.seg2 button.on{background:var(--pri);color:var(--prifg)}
.switchrow{display:flex;gap:14px;justify-content:space-between;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line2)}
.switchrow:last-child{border-bottom:0}
.switchrow .t1{font-weight:700}
.switchrow .t2{font-size:13.5px;color:var(--mute);max-width:560px}
.tg{width:40px;height:23px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:99px;background:#fff;transition:left .15s}
.tg.on{background:var(--pri)}
.tg.on::after{left:20px}
.setgrid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
.subnav{display:flex;flex-direction:column;gap:2px;position:sticky;top:0}
.empty{padding:28px;text-align:center;color:var(--mute)}
.msg{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:460px}
.msg .lst{border-right:1px solid var(--line)}
.mi{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line2);background:none;padding:11px 16px}
.mi.on{background:var(--prisoft)}

COS.forEach((c,i)=>{const r=rng(hash(c.id)+3);c.appr=r()<.35?1+Math.floor(r()*3):0;c.over=r()<.5?Math.floor(r()*9):0;c.act=['vor 5 Min.','vor 1 Std.','vor 3 Std.','heute','gestern','vor 3 Tagen','vor 1 Woche','vor 3 Wochen'][Math.floor(r()*8)];c.tr=5+Math.floor(r()*30);
c.color=SQC[i%SQC.length];c.st=c.studios.map((n,j)=>({id:c.id+'s'+j,name:n}))});
const coById=id=>COS.find(c=>c.id===id);
const TIMES=['07:00','08:15','09:30','10:45','12:15','17:00','18:15','19:30','20:30'];
const DEF_TYPES=['Yoga Flow','HIIT','Pilates','Spinning','Rücken Fit','Bodypump','Zumba','Mobility'];
const EMP=[['Freiberuflich','32,00 € / Kurs',32],['Freiberuflich','0,55 € / Min.',30],['Minijob','14,00 € / Std.',14],['Freiberuflich','28,00 € / Kurs',28],['Festangestellt','Festgehalt',0]];

function data(c){
  if(c.cache)return c.cache;
  const r=rng(hash(c.id)+11);
  const types=(c.types||DEF_TYPES).map((n,i)=>({id:c.id+'t'+i,name:n,color:TYC[i%TYC.length],dur:i%3?60:45}));
  let names=c.id==='c1'?POOL.slice(0,9):c.id==='c2'?['Lena Vogt','Mara Busch','Felix Lorenz','Ida Sommer','Paul Winter','Nora Haas']:POOL.slice(hash(c.id)%7,hash(c.id)%7+7);
  const trainers=names.map((n,i)=>{const e=EMP[(i+(c.id==='c1'?0:2))%EMP.length];
    return {name:n,role:'trainer',emp:e[0],rate:e[1],rv:e[2],studios:i%4===2?[c.st[0].id]:'all',klein:i%3===0,
    upd:['vor 2 Std.','gestern','vor 3 Tagen','24.11.','19.11.','12.11.','05.11.','30.10.','28.10.'][i%9],
    issue:c.id==='c1'?({6:'IBAN fehlt',8:'Steuernummer fehlt'})[i]||'':''}});
  const slots=[];
  c.st.forEach(s=>{for(let d=1;d<=7;d++){const n=d<=5?2+(r()<.5?1:0):1+(r()<.6?1:0);
    const ts=[...TIMES].sort(()=>r()-.5).slice(0,n).sort();
    ts.forEach(t=>{const ty=types[Math.floor(r()*types.length)];slots.push({id:'sl'+slots.length,studio:s.id,d,start:t,type:ty,trainer:trainers[Math.floor(r()*trainers.length)].name})})}});
  if(c.id==='c1'||c.id==='c2')slots.forEach((s,i)=>{if(i%6===0)s.trainer='Lena Vogt'});
  const sess=slots.map(s=>{let st,sub=null,tr=s.trainer;const x=r();
    if(s.d<TODAY){st=x<.8?'done':x<.88?'overdue':x<.94?'cancelled':'done';if(x>=.94){sub=tr;tr=trainers.filter(t=>t.name!==sub)[Math.floor(r()*(trainers.length-1))].name}}
    else if(s.d===TODAY){st=s.start<NOW?(x<.7?'done':'open'):'planned'}else st='planned';
    return {...s,st,trainer:tr,sub}});
  sess.push({id:'adhoc',studio:c.st[0].id,d:3,start:'13:00',type:types[0],trainer:trainers[1].name,st:'done',adhoc:true});
  sess.sort((a,b)=>a.d-b.d||a.start.localeCompare(b.start));
  const team=[
    {name:c.id==='c1'?'Miriam Albers':'Sven Roth',role:'admin',upd:'heute',email:'m.albers'},
    {name:c.id==='c1'?'Daniel Fuchs':'Katrin Ost',role:'admin',upd:'03.11.'},
    {name:'Tobias Reiter',role:'studio',studios:[c.st[0].id,(c.st[1]||c.st[0]).id],upd:'gestern'},
    ...(c.st[2]?[{name:'Paula Lenz',role:'studio',studios:[c.st[2].id],upd:'20.11.'}]:[]),
    ...trainers,
    {name:'Clara Neumann',role:'trainer',emp:'Freiberuflich',rate:'30,00 € / Kurs',rv:30,studios:'all',pending:'Tobias Reiter',upd:'vor 40 Min.'},
    ...(c.st[2]?[{name:'Jule Franke',role:'trainer',emp:'Minijob',rate:'14,00 € / Std.',rv:14,studios:'all',pending:'Paula Lenz',upd:'vor 2 Std.'}]:[])
  ];
  const bill=trainers.map((t,i)=>{const n=8+Math.floor(r()*14);const free=t.emp==='Freiberuflich';const net=free?n*(t.rv||30):0;const vat=free&&!t.klein?net*.19:0;
    let st=['approved','auto','approved','open','approved','open','skip','approved','skip'][i%9];if(t.name==='Jonas Brandt')st='corr';if(!free&&st!=='skip')st='issued';
    return {...t,n,free,net,vat,st}});
  return c.cache={types,trainers,slots,sess,team,bill};
}

const ST={done:['Erfasst','b-ok'],overdue:['Überfällig','b-err'],open:['Offen','b-warn'],planned:['Geplant',''],cancelled:['Abgesagt','b-off']};
const sbadge=s=>`<span class="badge ${ST[s.st][1]}">${ST[s.st][0]}</span>`;

const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const isoW=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)};
const f2=d=>`${d.getDate()}.${d.getMonth()+1}.`;
function perLabel(p){
  if(p.u==='week'){const a=new Date(2026,10,23+7*p.o),b=new Date(2026,10,29+7*p.o);return `KW ${isoW(a)} · ${f2(a)}–${f2(b)}${a.getFullYear()!==2026?a.getFullYear():''}`}
  if(p.u==='month'){const d=new Date(2026,10+p.o,1);return `${MON[d.getMonth()]} ${d.getFullYear()}`}
  if(p.u==='quarter'){const q=3+p.o;const y=2026+Math.floor(q/4);return `Q${((q%4)+4)%4+1} ${y}`}
  if(p.u==='year')return `${2026+p.o}`;
  return '';
}

function concept(){
  const M=[['Companies anlegen, löschen, Support','y','n','n','n'],['Plattform-Admins verwalten','y','n','n','n'],['Studios anlegen und bearbeiten','y','y','lesend (eigene)','n'],['Kurspläne','y','y','eigene Studios','lesend, freigegebene Studios'],['Kurstypen','y','y','Recht: darf / mit Bestätigung / nicht','n'],['Verträge anbieten','y','y','Recht, Standard mit Bestätigung','annehmen / ablehnen'],['Verträge bestätigen, auf Studios beschränken','y','y','n','n'],['Admins und Studio-Admins einladen','y','y','n','n'],['Kurse (Monitoring)','y','y','eigene Studios','eigene Kurse'],['Kurse erfassen, Vertretungen','n','n','n','y, freigegebene Studios'],['Gutschriften erstellen','y','y','bei Abrechnung je Studio, sonst Recht','prüfen, freigeben, Korrektur'],['Monats-Export','y','y','eigene Studios','eigene Kurse'],['Rechte der Studio-Admins festlegen','y','y','lesend','n'],['Datenschutz: Auskunft, Löschung, Offboarding','y','y','n','eigene Daten']];
  const cell=v=>v==='y'?'<span class="y">✓</span>':v==='n'?'<span class="n">–</span>':`<span class="cc">${v}</span>`;
  const sb=`<div style="display:grid;grid-template-columns:30% 1fr;height:100%"><div style="background:var(--side);border-right:1px solid var(--line);padding:8px 6px"><div style="height:14px;border:1px solid var(--line);border-radius:4px;margin-bottom:6px;background:var(--panel)"></div>${[1,0,0,0,0].map(o=>`<div style="height:7px;border-radius:3px;margin:5px 2px;background:${o?'var(--pri)':'var(--line)'}"></div>`).join('')}</div><div style="padding:8px"><div style="height:8px;width:40%;background:var(--ink);border-radius:3px;opacity:.7"></div><div style="margin-top:8px;height:96px;border:1px solid var(--line);border-radius:5px;background:var(--panel)"></div></div></div>`;
  const tb=`<div style="display:grid;grid-template-rows:16px 16px 1fr;height:100%"><div style="background:var(--side);border-bottom:1px solid var(--line);display:flex;gap:4px;padding:4px 6px">${[1,0,0,0].map(o=>`<div style="width:28px;border-radius:3px;background:${o?'var(--pri)':'var(--line)'}"></div>`).join('')}</div><div style="border-bottom:1px solid var(--line);display:flex;gap:4px;padding:4px 6px;background:var(--panel)">${[1,0,0,0,0].map(o=>`<div style="width:22px;border-radius:3px;background:${o?'var(--pri)':'var(--line)'}"></div>`).join('')}</div><div style="padding:8px"><div style="height:8px;width:40%;background:var(--ink);border-radius:3px;opacity:.7"></div><div style="margin-top:8px;height:64px;border:1px solid var(--line);border-radius:5px;background:var(--panel)"></div></div></div>`;
  return `<div class="concept-pane"><div class="cwrap"><div style="display:flex;justify-content:space-between;gap:16px;align-items:flex-start"><h1>Sidebar mit Company-Wechsler statt zwei Tab-Leisten</h1><button class="btn" data-a="concept">${ic('x','s')}Zum Prototyp</button></div>
  <p class="lead">Deine Idee löst das richtige Problem: man muss immer sehen, in welcher Company man ist, und schnell wechseln können. Ich würde es trotzdem anders bauen. Beide Varianten sind im Prototyp oben umschaltbar, damit du sie direkt vergleichen kannst.</p>
  <div class="cgrid">
   <div class="panel"><div class="hd"><h2>Warum Sidebar</h2></div><div class="bd"><div class="mini"><div><div class="fr">${sb}</div><div class="cap">Sidebar: volle Höhe für Inhalt</div></div><div><div class="fr">${tb}</div><div class="cap">Zwei Leisten: rund 100 px weniger</div></div></div><ul style="margin-top:12px"><li><b>Platz:</b> Am Desktop fehlt Höhe, nicht Breite. Zwei Leisten kosten auf jeder Seite so viel Höhe, wie dich heute an den KPI-Karten stört.</li><li><b>Skaliert:</b> Tabs passen für 2 bis 4 Companies. Plattform-Admins sehen alle 14 (später mehr), also bräuchte die obere Leiste ohnehin ein „Weitere“-Menü mit Suche. Der Wechsler mit Suche funktioniert für 2 genauso wie für 200.</li><li><b>Klare Ebenen:</b> „Plattform“ ist keine Company. In der Sidebar ist es ein eigener Abschnitt oben, nicht ein Tab neben den Companies.</li><li><b>Studio-Filter</b> sitzt direkt unter der Company und gilt für alle Bereiche.</li></ul></div></div>
   <div class="panel"><div class="hd"><h2>Gestaffelt nach Anzahl Companies</h2></div><div class="bd"><ul><li><b>1:</b> kein Wechsler, nur der Name.</li><li><b>2 bis 5:</b> einfache Liste, Tasten 1 bis 5 springen direkt.</li><li><b>6 bis 19:</b> Suchfeld, Angepinnt (Stern) und Zuletzt geöffnet oben, Strg K von überall.</li><li><b>Ab 20</b> (Plattform-Admin): Startseite ist eine Übersicht mit durchsuchbarer Company-Tabelle, offenen Freigaben und letzter Aktivität. In einer Company zeigt eine Kontextleiste „Du bist in X“ mit Zurück zur Plattform.</li><li>Die Sidebar lässt sich auf Icons einklappen, das wird gemerkt.</li></ul><p class="muted sm">Im Prototyp: Rolle Company-Admin und oben „Companies 2 / 8 / 24“ umschalten, Plattform-Admin hat 64.</p></div></div>
   <div class="panel"><div class="hd"><h2>Neue Aufteilung: 5 statt 8 Bereiche</h2></div><div class="bd"><ul><li><b>Übersicht</b> (neu): „Wartet auf dich“ mit Bestätigungen, Überfälligem, Korrekturen, dazu der heutige Tag.</li><li><b>Kurse</b> statt Monitoring, Liste oder pro Trainer:in.</li><li><b>Kurspläne</b> mit Versionen direkt im Kopf.</li><li><b>Team</b> für alle Personen, Vertrag, Studio-Freigabe und Datenschutz im Seitenpanel der Person.</li><li><b>Abrechnung</b> mit Prüfliste rechts.</li><li>Studios, Kurstypen, Rechte, Abrechnungsregeln und Company-Export wandern in die <b>Einstellungen</b>, weil man sie selten braucht. Darstellung ist im Avatar-Menü.</li></ul></div></div>
   <div class="panel"><div class="hd"><h2>Weniger Platz für Kennzahlen, Desktop zuerst, hellerer Darkmode</h2></div><div class="bd"><ul><li>Statt KPI-Karten eine Zeile Status-Chips mit Zahlen. Die Chips filtern gleichzeitig die Tabelle, rund 36 statt 120 px.</li><li>Volle Breite bis 1480 px, dichte Tabellen, Details im Seitenpanel. Die Liste bleibt dabei sichtbar.</li><li>Darkmode in warmem Anthrazit #2B2926 statt fast schwarz #131211. Flächen heben sich klar ab, Petrol wird zu hellem Türkis.</li><li>Trainer:innen wechseln keine Company. Alle Verträge erscheinen in einer Woche, die Company ist ein Filter.</li></ul></div></div>
  </div>
  <h2 style="font-size:22px;margin-bottom:10px">Wer darf was</h2><p class="muted" style="margin-top:0">Abgeleitet aus dem neuen Rollenmodell (Studio-Admin-Rechte, Vertragsbestätigung, Studio-Freigabe).</p>
  <div class="tblw"><table class="matrix"><thead><tr><th>Bereich</th><th>Plattform-Admin</th><th>Company-Admin</th><th>Studio-Admin</th><th>Trainer:in</th></tr></thead><tbody>${M.map(r=>`<tr><td><b>${r[0]}</b></td>${r.slice(1).map(cell).join('')}</tr>`).join('')}</tbody></table></div>
  <p class="muted sm" style="margin-top:14px">Alle Namen, Companies und Zahlen im Prototyp sind Beispieldaten.</p></div></div>`;
}

/* ---------- Render ---------- */
function content(){
  const pg={overview:pOverview,courses:pCourses,plans:pPlans,team:pTeam,billing:pBilling,settings:pSettings,companies:pCompanies,admins:pAdmins,support:pSupport,help:pHelp,'t-courses':tCourses,'t-bill':tBilling,'t-profile':tProfile,profile:pProfile};
  return (pg[S.page]||pOverview)();
}
function render(){
  if(S.theme==='dim')S.theme='dark';root.dataset.theme=S.theme;
  let stage;
  if(S.device==='mobile'&&S.role==='trainer')stage=mobile();
  else{
    const t3=tier()===3&&S.role!=='trainer'&&S.ctx!=='platform'&&!['companies','admins','support'].includes(S.page);
    const c=co();
    const bar=t3?`<div class="ctxbar"><span class="sq" style="background:${c.color}">${ini(c.name)}</span><span>Du bist in <b>${esc(c.name)}</b></span><button class="pinb ${S.pins.includes(c.id)?'on':''}" data-a="pin" data-v="${c.id}" title="Anheften">${ic('star','s')}</button><span class="sp"></span><button class="btn sm g" data-a="pop" data-v="co">Wechseln <span class="kbd" style="font-size:11px;color:var(--mute)">Strg K</span></button>${S.role==='platform'?`<button class="btn sm g" data-a="imp">${ic('user','s')}Als Company-Admin ansehen</button>`:''}<button class="btn sm" data-a="page" data-v="companies">${ic('back','s')}${S.role==='platform'?'Zur Plattform':'Alle Companies'}</button></div>`:'';
    const imp=S.imp&&S.role==='platform'&&S.ctx!=='platform'?`<div class="impbar">${ic('lock','s')}<span style="flex:1">Du siehst <b>${esc(c.name)}</b> wie der Company-Admin, nur lesend. Der Zugriff steht im Verlauf der Company.</span><button class="btn sm" data-a="imp">Beenden</button></div>`:'';
    const main=`<main class="main">${imp||bar}<div class="wrap ${imp?'ro':''}">${content()}</div></main>`;
    stage=S.nav==='sidebar'?`<div class="app side-layout ${S.col?'col':''}">${sidebar()}${main}${drawer()}${pop()}${S.toast?`<div class="toast">${ic('check','s')}${esc(S.toast)}</div>`:''}</div>`
      :`<div class="app bars-layout">${bars()}${main}${drawer()}${pop()}${S.toast?`<div class="toast">${ic('check','s')}${esc(S.toast)}</div>`:''}</div>`;
  }
  const sc=document.querySelector('.main')?.scrollTop||0;
  document.getElementById('root').innerHTML=proto()+`<div class="stage">${stage}${S.concept?concept():''}</div>`;
  const m=document.querySelector('.main');if(m&&!S._reset)m.scrollTop=sc;S._reset=false;
  const cs=document.getElementById('cosearch');if(cs)cs.focus();
}
function go(p){S._reset=true;Object.assign(S,{pop:null,drawer:null,edit:false},p);set({})}

/* ---------- Ereignisse ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,v=el.dataset.v;
  const A={
   role:()=>{const p=PERSONA[v];go({role:v,ctx:v==='platform'?'platform':p.cos[0],page:v==='platform'?'companies':v==='trainer'?'t-courses':'overview',studio:'all',device:v==='trainer'?S.device:'desktop',team:'all',kst:'all'})},
   nav:()=>set({nav:v,pop:null}),device:()=>set({device:v}),theme:()=>{try{localStorage.setItem('cy-theme',v)}catch(e){}set({theme:v,pop:null})},concept:()=>set({concept:!S.concept}),
   page:()=>go(v==='companies'&&S.role==='platform'?{page:v,ctx:'platform'}:{page:v}),ctx:()=>{S.tsel=[];S.ksel=[];if(v!=='platform')S.recent=[v,...S.recent.filter(x=>x!==v)].slice(0,6);go(v==='platform'?{ctx:'platform',page:'companies'}:{ctx:v,page:['companies','admins','support'].includes(S.page)||S.ctx==='platform'?'overview':S.page,studio:'all'})},
   pin:()=>{S.pins=S.pins.includes(v)?S.pins.filter(x=>x!==v):[...S.pins,v];render()},
   ncos:()=>go({ncos:+v,ctx:'c1',page:'overview',studio:'all'}),col:()=>set({col:!S.col}),cof:()=>set({cof:v}),per:()=>{const k=el.dataset.k;S[k]={...S[k],o:v==='0'?0:S[k].o+ +v};render()},
   pop:()=>set({pop:S.pop===v?null:v}),close:()=>set({pop:null,drawer:null}),
   kst:()=>set({kst:v}),kview:()=>set({kview:v}),team:()=>set({team:v}),bill:()=>set({bill:v}),setsub:()=>set({set:v}),
   plan:()=>set({plan:v}),'plan-go':()=>go({page:'plans',plan:v}),edit:()=>set({edit:v==='1'}),publish:()=>{S.edit=false;S.drawer=null;toast('Version 5 gilt ab Mo 30.11. Version 4 archiviert.')},
   goto:()=>{const [p,f]=v.split(':');go({page:p,kst:f,kview:'list'})},
   approve:()=>{S.done[v]=true;S.drawer=null;toast(v.startsWith('pend:')?`Vertrag bestätigt. ${v.slice(5)} wird benachrichtigt.`:'Kurstyp „Aerial Yoga“ bestätigt.')},
   reject:()=>{S.done[v]=true;S.drawer=null;toast('Abgelehnt. Der Studio-Admin wird benachrichtigt.')},
   approveall:()=>{const l=pendList();l.forEach(p=>S.done['pend:'+p.name]=true);toast(`${l.length} Verträge bestätigt.`)},
   goto2:()=>{const [p,f]=v.split(':');go({page:p,team:f})},
   tsel:()=>{S.tsel=S.tsel.includes(v)?S.tsel.filter(x=>x!==v):[...S.tsel,v];render()},
   selall:()=>{const ids=[...document.querySelectorAll('[data-a="tsel"]')].map(x=>x.dataset.v);S.tsel=ids.every(i=>S.tsel.includes(i))?[]:ids;render()},
   tclear:()=>set({tsel:[]}),
   bulkapprove:()=>{const l=data(co()).team.filter(p=>S.tsel.includes(p.name)&&p.pending&&!S.done['pend:'+p.name]);l.forEach(p=>S.done['pend:'+p.name]=true);S.tsel=[];toast(`${l.length} Verträge bestätigt.`)},
   ksel:()=>{S.ksel=S.ksel.includes(v)?S.ksel.filter(x=>x!==v):[...S.ksel,v];render()},
   kall:()=>{const ids=[...document.querySelectorAll('[data-a="ksel"]')].map(x=>x.dataset.v);S.ksel=ids.every(i=>S.ksel.includes(i))?[]:ids;render()},
   kclear:()=>set({ksel:[]}),kbulk:()=>{const n=S.ksel.length;S.ksel=[];toast(`${v} (${n} Kurse).`)},
   diff:()=>set({drawer:{k:'diff'}}),
   setupdone:()=>{S.done['setup'+v]=true;render()},setupgo:()=>{const [t,k]=v.split('|');const [p,sub]=t.split(':');S.done[k]=true;go(sub?{page:p,set:sub}:{page:p})},
   logf:()=>set({logf:v}),imp:()=>set({imp:!S.imp}),
   tall:()=>{tSess().filter(s=>s.st==='overdue'||s.st==='open').forEach(s=>S.done['s'+s.id+s.co.id]=true);toast('Alle als gegeben bestätigt.')},
   take:()=>{S.done[v]=true;toast('Vertretung übernommen. Der Kurs steht jetzt in deiner Woche.')},
   subreq:()=>set({drawer:{k:'subreq',v},subMode:'all'}),submode:()=>set({subMode:v}),
   subsend:()=>{S.open[v]=true;S.drawer=null;toast(S.subMode==='one'?'Anfrage an Jonas Brandt gesendet.':'An 6 Kolleg:innen ausgeschrieben.')},
   push:()=>set({push:!S.push}),pushdone:()=>{S.done[v]=true;S.push=false;toast('Danke, Kurs bestätigt.')},
   person:()=>set({drawer:{k:'person',v}}),add:()=>set({drawer:{k:'add'}}),addrole:()=>set({addRole:v}),
   invite:()=>{S.drawer=null;toast(S.role==='studio'?'Angebot gespeichert. Der Company-Admin bestätigt es.':'Einladung gesendet.')},
   perm:()=>{const [k,l]=v.split(':');S.perm[k]=l;toast('Rechte gespeichert.')},tg:()=>{S.tg[v]=!S.tg[v];render()},
   msg:()=>set({msg:+v}),markread:()=>{S.done.inbox=true;toast('Als erledigt markiert.')},
   toast:()=>{S.pop=null;toast(v)},studio:()=>{},
   tco:()=>set({tco:v}),tview:()=>set({tview:v}),tdone:()=>{S.done[v]=true;toast('Kurs bestätigt.')},req:()=>{S.done.req=true;toast('Antwort an Jonas Brandt gesendet.')},
   expand:()=>set({expand:S.expand===v?null:v}),docst:()=>{S.done.doc=v;S.expand=null;toast(v==='approved'?'Gutschrift freigegeben.':'Korrekturwunsch gesendet.')},
   offer:()=>{S.done.offer=true;toast('Antwort an Yogaloft gesendet.')},
   log:()=>set({drawer:{k:'log'}}),logmode:()=>set({logMode:v}),logsave:()=>{S.drawer=null;S.sheet=false;toast('Kurs eingetragen.')},
   mpage:()=>set({mpage:v}),mday:()=>set({mday:+v}),sheet:()=>set({sheet:true}),sheetclose:()=>set({sheet:false})
  };
  if(A[a]){e.preventDefault();A[a]()}
});
document.addEventListener('change',e=>{if(e.target.dataset.a==='studio')go({studio:e.target.value});if(e.target.dataset.a==='perunit'){S[e.target.dataset.k]={u:e.target.value,o:0};render()}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='cosearch'){const q=t.value.trim().toLowerCase();const L=document.getElementById('colist');L.querySelector('.fixed').style.display=q?'none':'';L.querySelector('.all').style.display=q?'':'none';let n=0;L.querySelectorAll('.all .pi').forEach(b=>{const m=b.dataset.n.includes(q);b.style.display=m?'':'none';if(m)n++});L.querySelector('.nohit').style.display=n?'none':''}
  if(t.dataset.f){const q=t.value.toLowerCase();document.querySelectorAll('#'+t.dataset.f+' tr').forEach(r=>r.style.display=(r.dataset.q||'').includes(q)?'':'none')}
});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&S.role!=='trainer'&&P0().cos.length>1){e.preventDefault();set({pop:'co'})}
  if(e.key==='Escape')set({pop:null,drawer:null,sheet:false,concept:false});
  if(S.pop==='co'&&/^[1-9]$/.test(e.key)&&document.activeElement?.id!=='cosearch'){const id=quick()[+e.key-1];if(id){S.recent=[id,...S.recent.filter(x=>x!==id)].slice(0,6);go({ctx:id,page:S.ctx==='platform'||S.page==='companies'?'overview':S.page,studio:'all'})}}
});
if(S.role==='platform'){S.ctx='platform';S.page='companies'}else if(S.role==='trainer'){S.page='t-courses'}else S.ctx=P0().cos[0];
render();
}
</script>
